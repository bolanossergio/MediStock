<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock - inicio de sesion</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="left">
            <a href="../index.html" class="volver-inicio">
                <i class="fa-solid fa-arrow-left"></i>
                Volver al inicio
            </a>
            <img src="./img/logo.jpeg" alt="Logo de MediStock" class="logo">
            <h1>MediStock</h1>
            <p>Bienvenido al sistema de gestión de medicamentos</p>
        </div>

        <div class="right">
            <form action="login.php" method="POST">
                <h2>Iniciar Sesion</h2>
                
                <div class="linea-verde"></div>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Ingrese su usuario" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Ingrese su contraseña" required>
                    <i class="fa-solid fa-eye"></i>
                </div>

                <a href="#" class="olvide">¿Olvidaste tu contraseña?</a>

                <button type="submit">Iniciar Sesion</button>

                <div class="separador">
                    <span>o continua con</span>
                </div>

                <div class="social">
                    <button class="google">
                        <i class="fa-brands fa-google"></i>
                        Google
                    </button>

                    <button class="microsoft">
                        <i class="fa-brands fa-microsoft"></i>
                        Microsoft
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediStock - Registro</title>

    <link rel="stylesheet" href="./css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="registro-container">

        <!-- PANEL IZQUIERDO -->
        <div class="left">

            <a href="../login-page/index.html" class="volver-inicio"">
                <i class="fa-solid fa-arrow-left"></i>
                Volver al inicio
            </a>

            <img src="../InicioSesion/img/logo.jpeg"
                 alt="Logo de MediStock"
                 class="logo">

            <h1>MediStock</h1>

            <p>
                Crea tu cuenta para gestionar
                medicamentos de forma fácil y segura.
            </p>

        </div>


        <!-- PANEL DERECHO -->
        <div class="right">

            <form>

                <h2>Crear cuenta</h2>

                <div class="linea-verde"></div>


                <!-- NOMBRE COMPLETO -->
                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        placeholder="Nombre completo"
                        required>

                </div>


                <!-- CORREO -->
                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        placeholder="Correo electrónico"
                        required>

                </div>


                <!-- USUARIO -->
                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        placeholder="Nombre de usuario"
                        required>

                </div>


                <!-- CONTRASEÑA -->
                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Contraseña"
                        required>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Confirmar contraseña"
                        required>

                </div>


                <!-- TÉRMINOS -->
                <div class="terminos">

                    <input type="checkbox" required>

                    <span>
                        Acepto los términos y condiciones
                    </span>

                </div>


                <!-- BOTÓN REGISTRARSE -->
                <button type="submit" class="btn-registrarse">
                    Registrarse
                </button>


                <!-- ENLACE LOGIN -->
                <p class="ya-cuenta">
                    ¿Ya tienes una cuenta?
                    <a href="../InicioSesion/index.html">Inicia sesión</a>
                </p>

            </form>

        </div>

    </div>

</body>

</html>
